<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The IEEE arrow-and-diamond mark, matching BrandMark in the header, on
       IEEE navy. Held in the brand's own secondary blues: light blue for the
       solid bars and silk for the diamonds, which is the pairing the mark
       uses on any dark ground - IEEE dark blue on navy is ~1.3:1 and would
       vanish at 16px. -->
  <rect width="100" height="100" rx="18" fill="#002855"/>
  <g transform="translate(11 11) scale(0.78)">
    <polygon points="50,2 62,14 50,26 38,14" fill="#f7f8fa"/>

    <polygon points="20,30 36,30 48,42 80,42 92,36 80,30 36,30" fill="#58b4e0"/>
    <polygon points="20,30 36,30 36,42 24,42" fill="#f7f8fa"/>

    <polygon points="8,46 92,46 92,54 8,54" fill="#58b4e0"/>
    <polygon points="8,46 24,46 8,54" fill="#f7f8fa"/>
    <polygon points="50,46 58,50 50,54 42,50" fill="#f7f8fa"/>

    <polygon points="20,58 36,58 48,58 80,58 92,64 80,70 36,70" fill="#58b4e0"/>
    <polygon points="20,58 36,58 36,70 24,70" fill="#f7f8fa"/>

    <polygon points="50,74 62,86 50,98 38,86" fill="#f7f8fa"/>
  </g>
</svg>
